version: '3.9'

services:
  # 🚀 SERVICIO 1: LA API (Web, Login, Controladores)
  backend:
    container_name: backend-riego
    build: .
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DB_HOST=mariadb  
      - DB_USER=root
      - DB_PASS=admin
      - DB_NAME=riego
      - FIREBASE_ENABLED=true
      - MQTT_ENABLED=false # La API no escucha sensores, solo envía órdenes
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
    depends_on:
      - mariadb
      - mosquitto
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev # Ejecuta index.js

  # 👷 SERVICIO 2: EL WORKER (Cron, Sensores, Históricos) <-- ¡NUEVO!
  backend-worker:
    container_name: backend-worker
    build: .
    restart: always
    # No necesita puertos (no tiene web)
    environment:
      - DB_HOST=mariadb
      - DB_USER=root
      - DB_PASS=admin
      - DB_NAME=riego
      - FIREBASE_ENABLED=true
      - MQTT_ENABLED=true # Este sí escucha sensores
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_TOPICS=fincas/#
    depends_on:
      - mariadb
      - mosquitto
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: npm run finca # Ejecuta worker.js (Asegúrate de tener este script en package.json)

  # 🦟 MOSQUITTO
  mosquitto:
    # ... (igual que antes) ...
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  # 🗄️ MARIADB
  mariadb:
    # ... (igual que antes) ...
    image: mariadb:11
    container_name: mariadb
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=admin
      - MYSQL_DATABASE=riego
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./riego.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  # 🧰 PHPMYADMIN
  phpmyadmin:
    # ... (igual que antes) ...
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=mariadb
      - PMA_USER=root
      - PMA_PASSWORD=admin
    depends_on:
      - mariadb

volumes:
  mariadb_data: